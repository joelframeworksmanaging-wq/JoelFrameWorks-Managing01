<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Order | Joel Frame Work's</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="framekala-section-refresh.css">
<link rel="stylesheet" href="checkout-framekala.css?v=20261112-3">
<link rel="stylesheet" href="checkout-mobile-review.css?v=20261112-1">
</head>
<body class="checkout-page jfw-framekala-checkout">
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html"><img class="brand-logo-image" src="assets/joel-logo.png" alt="Joel Frame Work's"></a>
    <a class="nav-cta" href="index.html#products">Continue shopping</a>
  </div>
</header>
<main class="checkout-main">
  <div class="container checkout-container">
    <div class="checkout-heading">
      <p class="eyebrow">JOEL FRAME WORK'S</p>
      <h1>Review your order</h1>
      <p>Make sure your frame and photo are correct.</p>
    </div>
    <div class="checkout-layout jfw-review-layout">
      <section class="checkout-left">
        <div class="checkout-card jfw-review-product-card">
          <div class="checkout-card-title"><h2>Your selection</h2><span id="checkoutItemType">ORDER</span></div>
          <div class="jfw-selection-row"><div class="checkout-summary-product">
            <div class="checkout-summary-thumb" id="checkoutThumb"><img src="assets/shopping-trolley-icon.svg" alt="Shopping trolley"></div>
            <div>
              <strong id="checkoutItemName">Your frame order</strong>
              <small id="checkoutItemDescription"></small>
              <small id="checkoutOrderId"></small>
            </div>
          </div>
          <div id="checkoutPhotoList" class="checkout-photo-list"></div></div>
        </div>
        <div id="checkoutStatus" class="checkout-status" hidden></div>
        <button id="continueAddressButton" class="checkout-pay-button jfw-glass-checkout-button">
          <span>Continue to checkout</span><span aria-hidden="true">→</span>
        </button>
        <p class="jfw-review-secure-note">Secure checkout · Your order details are protected</p>
      </section>
      <aside class="checkout-summary jfw-review-summary">
        <div class="checkout-card-title"><h2>Order summary</h2><span>PRICE</span></div>
        <div class="checkout-summary-lines">
          <div><span>Item total</span><strong id="checkoutSubtotal">₹0</strong></div>
          <div><span>Delivery</span><strong class="checkout-free">Calculated separately</strong></div>
          <div class="checkout-total"><span>Total</span><strong id="checkoutTotal">₹0</strong></div>
        </div>
        <a class="checkout-back-link" href="javascript:history.back()">← Back</a>
      </aside>
    </div>
  </div>
</main>
<script src="checkout.js"></script>
</body>
</html>
